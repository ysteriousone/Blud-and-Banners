l_english:
 ENG_grounded_air_force:0 "Grounded Air Force"
 ENG_grounded_air_force_desc:0 "During the Great War, airplances became a new method of waging war. While we were able to deploy them effectively against the Germans, our Air Force has not been able to keep up with the world. Lack of funding, development and training have made fielding a capable airforce an impossibility."
 ENG_national_armed_forces_reform_plan:0 "National Armed Forces Reform Plan"
 ENG_national_armed_forces_reform_plan_desc:0 "In order to get the armed forces in working shape, we have to throw and burn the entire system and rebuild it bottom up!"
 ENG_non_existent_economy:0 "An Economy That Doesn't Exist?"
 ENG_non_existent_economy_desc:0 "Furing the Great War, we supercharged our economy in order to keep sustaining the war effort. When we lost, our defence companies collapsed, taking the entire market down with them. The Pound is worthless, and our nation has been reduced to the state of nothingness."
 ENG_outdated_navy:0 "Outdated Navy"
 ENG_outdated_navy_desc:0 "Ever since the Great War took down our most feared fleets, the English Fleet has been nothing more than floating scraps held together by hopes and dreams. The fear the Royal NAvy once struck into the hearts of our enemies has now been replaced with contempt."
 ENG_will_of_people:0 "Will of the British People"
 ENG_will_of_people_desc:0 "Even through all of the trials, the Great War, the Dark Depression, the failed colonization, the people of Britain remain proud, defiant in the face of disaster. They possess the spark of growth, the desire to make their home better, to secure their place in the world. through them, Britain will stand."
 ENG_will_of_the_people:0 "Will of the British People"
 ENG_will_of_the_people_desc:0 "Even through all of the trials, the Great War, the Dark Depression, the failed colonization, the people of Britain remain proud, defiant in the face of disaster. They possess the spark of growth, the desire to make their home better, to secure their place in the world. through them, Britain will stand."
 KMT_war_industry:0 "Chinese War Industry"
 KMT_war_industry_desc:0 "In order to beat the Ming, we must be able to match their industrial output. Every Chinese fighter must have a weapon in his hand, and each platoon must have an entire industrial base behind him. The eyes of China are upon, the hopes of liberty loving people everywhere in China march with us. We must not let them down. FORWARD CHINA!"
 KMT_war_on_monarchy:0 "War on the Monarchy"
 KMT_war_on_monarchy_desc:0 "With the Ming oppressing us Chinese, it is time to strike abck and reclaim our land. We must prepare for conflict."
 collapsing_army_ENG:0 "Collapsing Army"
 collapsing_army_ENG_desc:0 "Ever since the Great War, our army has been in terrible shape. Outdated firearms, lack of training and poor combat performance against numerically inferior enemies have made the English Army a laughingstock."
 new_national_spirit:0 "New National Spirit"
 new_national_spirit_desc:0 "Describe this national spirit."
